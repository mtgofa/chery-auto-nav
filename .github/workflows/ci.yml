name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The car screen app: Windows CE 6.0 / ARMV4I, cross-compiled with cegcc.
  car-app-wince:
    name: Car app (Windows CE ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/mingw32ce
          key: mingw32ce-0.59.1-${{ hashFiles('tools/setup-toolchain.sh') }}

      - name: Install cross toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: ./tools/setup-toolchain.sh

      - name: Install 32-bit runtime
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Build CheryNav.exe
        run: make -C car_app CEGCC=/opt/mingw32ce

      # make already runs pe_check.py, but repeat it so a regression (an import
      # the head unit's loader cannot resolve) is obvious in the log.
      - name: Verify the image is loadable on the device
        run: python3 tools/pe_check.py car_app/build/CheryNav.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CheryNav-wince-arm
          path: car_app/build/CheryNav.exe

  # The phone app: Android APK built with the committed Gradle wrapper.
  mobile-app-android:
    name: Mobile app (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK pre-installed with API 34 /
      # build-tools 34 and licenses accepted, so we use that instead of
      # android-actions/setup-android (its v3 still tries to install the
      # removed legacy 'tools' package and fails).
      - name: Point Gradle at the pre-installed SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile_app/**/*.gradle*', 'mobile_app/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CheryAutoNav-debug-apk
          path: mobile_app/app/build/outputs/apk/debug/app-debug.apk
